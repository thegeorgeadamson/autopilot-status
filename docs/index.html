<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f3f4"><title>Autopilot service status</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Geist;src:url("fonts/geist-latin.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:light;font-family:Geist,system-ui,-apple-system,sans-serif;background:#fafafa;color:#202124;--green:#61b99c;--muted:#85878d;--line:#ececef}*{box-sizing:border-box}body{margin:0}main{max-width:960px;margin:0 auto;padding:0 36px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;height:96px;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;letter-spacing:-.04em}.brand svg{width:25px;height:25px}.brand-label{display:flex;gap:14px;align-items:center}.brand-label span{color:var(--muted);font-size:14px;font-weight:450;letter-spacing:0;border-left:1px solid #dedee1;padding-left:14px}a{color:inherit;text-decoration:none}.open-app{font-size:13px;color:#666970}.open-app:hover{color:#202124}h1{font-size:clamp(27px,4vw,36px);font-weight:550;letter-spacing:-.045em;line-height:1.2;margin:16px 0 12px}#summary{padding:48px 0 44px}#summary:before{content:'●  System status';font-size:12px;font-weight:500;color:#328568}#summary.unknown:before{color:#85878d}#summary.down:before{color:#b45338}#updated{font-size:14px;color:#777a80;margin:0;line-height:1.6}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}.controls h2{font-size:15px;font-weight:550;margin:0}nav{display:flex;gap:2px;padding:3px;background:#eeeef0;border-radius:9px}button{font:inherit;font-size:12px;color:#767980;background:transparent;border:0;padding:7px 11px;border-radius:6px;cursor:pointer}button[aria-pressed=true]{color:#202124;background:#fff;box-shadow:0 1px 3px rgb(17 24 39 / .07)}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #399477;outline-offset:4px}#services{border:1px solid #e6e6e9;border-radius:14px;background:white;overflow:hidden}.service+.service{border-top:1px solid var(--line)}.service-head{display:grid;grid-template-columns:minmax(150px,1fr) 145px 110px 16px;align-items:center;gap:24px;padding:24px;cursor:pointer;list-style:none}.service-head::-webkit-details-marker{display:none}.service-head:hover{background:#fcfcfd}.service h3{margin:0 0 5px;font-size:14px;font-weight:550;letter-spacing:-.015em}.service-description{font-size:12px;color:#8b8e94}.badge{font-size:12px;display:flex;align-items:center;gap:7px;color:#85878d}.badge.up{color:#328568}.badge.down{color:#b45338}.dot{height:6px;width:6px;border-radius:50%;background:#a5a6ab}.up .dot{background:var(--green)}.down .dot{background:#d68871}.availability{text-align:right}.availability strong{font-size:18px;font-weight:500;letter-spacing:-.035em;display:block}.availability span{display:block;color:#909298;font-size:10px;margin-top:3px}.chevron{width:7px;height:7px;border-right:1.5px solid #a0a2a7;border-bottom:1.5px solid #a0a2a7;transform:rotate(45deg);justify-self:end;transition:transform .15s}.service[open] .chevron{transform:rotate(225deg)}.history{padding:0 24px 24px}.chart-heading{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 12px;font-size:11px;color:#85878d}.chart-heading strong{font-size:14px;font-weight:500;color:#4a4d53}.plot{position:relative;padding-right:48px}.plot-label{position:absolute;right:0;font-size:10px;color:#a0a2a7}.plot-label.top{top:7px}.plot-label.bottom{bottom:8px}.mobile-availability{display:none}.chart{display:block;width:100%;height:90px}.chart-grid{stroke:#f0f0f2;stroke-width:1;vector-effect:non-scaling-stroke}.chart-line{fill:none;stroke:var(--green);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}.chart-line.partial{stroke:#c39b56}.chart-point{fill:var(--green)}.chart-point.partial{fill:#c39b56}.axis{display:flex;justify-content:space-between;font-size:10px;color:#92949b;padding-top:4px}.empty-history{border:1px dashed #e7e7eb;border-radius:8px;padding:26px 18px;text-align:center;color:#8b8e94;font-size:12px}.empty-history strong{display:block;font-size:12px;font-weight:450;color:#757880;margin-bottom:5px}.legend{display:none}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:24px;margin-top:8px;color:#999ba1;font-size:11px}@media(max-width:650px){main{padding:0 20px 28px}header{height:76px}.brand{font-size:16px}.brand-label{gap:9px}.brand-label span{padding-left:9px;font-size:12px}.brand svg{width:22px;height:22px}.open-app{font-size:12px}#summary{padding:34px 0}.service-head{grid-template-columns:1fr auto 12px;gap:14px;padding:20px}.availability{display:none}.mobile-availability{display:block;font-size:11px;color:#777a80;margin-bottom:12px}.badge{font-size:11px}.service-description{font-size:11px}.history{padding:0 20px 20px}.controls h2{font-size:14px}button{padding:7px 9px}}
</style>
</head>
<body><main>
<header><a class="brand" href="https://app.aplt.ai" aria-label="Autopilot home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 943 943" fill="currentColor" aria-hidden="true"><path d="M350.467,157.806 C373.18,120.678 415.153,97.807 460.578,97.807 C506.003,97.807 547.977,120.678 570.689,157.806 L880.241,663.811 C902.954,700.939 902.955,746.684 880.242,783.812 C857.53,820.94 815.555,843.812 770.129,843.812 C666.844,843.812 409.268,844.46 206.475,845.017 C149.658,845.148 97.088,816.644 68.59,770.255 C40.091,723.865 40.0,666.647 68.347,620.175 C169.791,453.795 298.775,242.302 350.467,157.806 ZM444.664,713.813 L696.72,713.813 C708.077,713.813 718.57,708.095 724.249,698.813 C729.926,689.531 729.926,678.094 724.249,668.813 L488.106,282.805 C482.429,273.523 471.934,267.805 460.578,267.805 C449.222,267.805 438.728,273.523 433.05,282.805 L307.025,488.811 C278.633,535.222 278.633,592.401 307.023,638.812 C335.414,685.222 387.883,713.813 444.664,713.813 Z"/></svg><span class="brand-label">Autopilot<span>Status</span></span></a><a class="open-app" href="https://app.aplt.ai">Open Autopilot ↗</a></header>
<section id="summary" class="unknown" aria-live="polite"><h1 id="headline">Service status</h1><p id="updated">Loading the latest updates…</p></section>
<div class="controls"><h2>Service availability</h2><nav aria-label="History range"><button data-hours="24" aria-pressed="true">24 hours</button><button data-hours="168" aria-pressed="false">7 days</button><button data-hours="720" aria-pressed="false">30 days</button></nav></div>
<div id="services"></div>
<footer><span>Autopilot service status</span><span id="historyUpdated">No history available yet.</span></footer>
</main>
<script>
const API='https://uptime-api.aplt.ai/status';
const DEFINITIONS=[{id:'app',name:'Autopilot',description:'Your workspace'},{id:'sign',name:'Autopilot Sign',description:'Document signing'},{id:'docs',name:'Documentation',description:'Help and guides'}];
let snapshot=null,hours=24,fetchFailed=false,restartsAt=null;
const expanded=new Set();
const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const ago=ms=>{const n=Math.max(0,Math.floor(ms/60000));return n<1?'just now':`${n} minute${n===1?'':'s'} ago`};
function draw(){
 const now=Date.now(),stale=!snapshot||now-Date.parse(snapshot.checkedAt)>180000;
 const fresh=DEFINITIONS.every(t=>{const row=snapshot?.targets.find(r=>r.target_id===t.id);return row&&now-row.minute*60000<=180000});
 const allUp=!fetchFailed&&!stale&&fresh&&snapshot.targets.every(r=>r.ok===1);
 const unavailable=fetchFailed||stale||!fresh;
 document.getElementById('summary').className=unavailable?'unknown':allUp?'':'down';
 document.getElementById('headline').textContent=unavailable?'Status unavailable':allUp?'All listed services are available':'Some services are unavailable';
 document.getElementById('updated').textContent=snapshot?`Last updated ${ago(now-Date.parse(snapshot.checkedAt))}${unavailable?' · current status unavailable':''}`:restartsAt?`Status updates resume ${new Date(restartsAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}.`:'The latest status is temporarily unavailable. Please check back soon.';
 const container=document.getElementById('services');container.querySelectorAll('details').forEach(d=>{if(d.open)expanded.add(d.dataset.service);else expanded.delete(d.dataset.service)});container.replaceChildren();
 const endHour=Math.floor((snapshot?Date.parse(snapshot.checkedAt):now)/3600000)*60;
 const groupHours=hours===720?8:hours===168?2:1;
 for(const t of DEFINITIONS){
  const row=snapshot?.targets.find(r=>r.target_id===t.id);
  const unknown=fetchFailed||!row||now-row.minute*60000>180000;
  const card=el('details','service'),heading=el('summary','service-head');card.dataset.service=t.id;card.open=expanded.has(t.id);
  const name=el('div','service-name');name.append(el('h3','',t.name),el('span','service-description',t.description));heading.append(name);
  const badge=el('span',`badge ${unknown?'':row.ok?'up':'down'}`);badge.append(el('span','dot'),el('span','',unknown?'Awaiting updates':row.ok?'Available':'Unavailable'));heading.append(badge);
  let totalChecks=0,passing=0;const buckets=[];
  for(let i=0;i<hours/groupHours;i++){
   const start=endHour-(hours-groupHours)*60+i*groupHours*60;
   const rows=(snapshot?.hourly??[]).filter(r=>r.target_id===t.id&&r.bucket>=start&&r.bucket<start+groupHours*60);
   const total=rows.reduce((n,r)=>n+r.total,0),up=rows.reduce((n,r)=>n+r.up,0);totalChecks+=total;passing+=up;const latency=rows.reduce((n,r)=>n+r.latency_sum,0);buckets.push({start,total,up,latency,ms:total?latency/total:null});
  }
  const availability=el('div','availability');availability.append(el('strong','',totalChecks?`${(passing/totalChecks*100).toFixed(2)}%`:'—'),el('span','','Observed availability'));heading.append(availability,el('span','chevron'));card.append(heading);
  const history=el('div','history');
  if(!totalChecks){const empty=el('div','empty-history');empty.append(el('strong','','No performance history yet'),el('span','','Updates will appear here as they become available.'));history.append(empty)}
  else{
   history.append(el('div','mobile-availability',`${(passing/totalChecks*100).toFixed(2)}% observed availability`));
   const average=buckets.reduce((n,b)=>n+b.latency,0)/totalChecks;
   const caption=el('div','chart-heading');caption.append(el('span','','Average response time · lower is better'),el('strong','',`${Math.round(average).toLocaleString()} ms`));history.append(caption);
   const peak=Math.max(100,...buckets.filter(b=>b.total).map(b=>b.ms));const magnitude=10**Math.floor(Math.log10(peak));const ceiling=[1,2,5,10].map(n=>n*magnitude).find(n=>n>=peak);
   const svgNode=tag=>document.createElementNS('http://www.w3.org/2000/svg',tag);
   const chart=svgNode('svg');chart.setAttribute('viewBox','0 0 800 80');chart.setAttribute('preserveAspectRatio','none');chart.classList.add('chart');chart.setAttribute('role','img');chart.setAttribute('aria-label',`${hours}-hour average response time: ${Math.round(average)} milliseconds. Lower is better. Gaps have no data.`);
   for(const y of [12,40,68]){const line=svgNode('path');line.setAttribute('d',`M 0 ${y} H 800`);line.classList.add('chart-grid');chart.append(line)}
   let path='',connected=false;
   buckets.forEach((bucket,i)=>{if(!bucket.total){connected=false;return}const x=4+i/(buckets.length-1)*792,y=68-bucket.ms/ceiling*56;path+=`${connected?' L':' M'} ${x} ${y}`;connected=true;const point=svgNode('circle');point.setAttribute('cx',x);point.setAttribute('cy',y);point.setAttribute('r','2');point.classList.add('chart-point');if(bucket.up<bucket.total)point.classList.add('partial');const title=svgNode('title');title.textContent=`${new Date(bucket.start*60000).toLocaleString()}: ${Math.round(bucket.ms).toLocaleString()} ms average response time${bucket.up<bucket.total?' · some requests unavailable':''}`;point.append(title);chart.append(point)});
   const line=svgNode('path');line.setAttribute('d',path);line.classList.add('chart-line');if(passing<totalChecks)line.classList.add('partial');chart.append(line);const plot=el('div','plot');plot.append(chart,el('span','plot-label top',`${ceiling.toLocaleString()} ms`),el('span','plot-label bottom','0 ms'));history.append(plot);
   const axis=el('div','axis');axis.append(el('span','',hours===24?'24 hours ago':hours===168?'7 days ago':'30 days ago'),el('span','','Now'));history.append(axis);
  }
  card.append(history);
  container.append(card);
 }
 document.getElementById('historyUpdated').textContent=snapshot?`History updated ${ago(now-Date.parse(snapshot.historyUpdatedAt))}`:'No history available yet.';
}
async function load(){if(document.hidden)return;try{const response=await fetch(API,{signal:AbortSignal.timeout(12000)});if(!response.ok){const error=await response.json().catch(()=>({}));restartsAt=error.startsAt??null;throw Error('Unavailable')}const data=await response.json();if(!Array.isArray(data.targets)||!Array.isArray(data.hourly)||!Array.isArray(data.daily)||!Number.isFinite(Date.parse(data.checkedAt)))throw Error('Invalid snapshot');snapshot=data;fetchFailed=false;restartsAt=null}catch{fetchFailed=true}draw()}
document.querySelectorAll('[data-hours]').forEach(button=>button.addEventListener('click',()=>{hours=Number(button.dataset.hours);document.querySelectorAll('[data-hours]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));draw()}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});draw();load();setInterval(load,60000);setInterval(draw,15000);
</script></body></html>
