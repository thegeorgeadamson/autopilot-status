  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }

<body>
  <main>
    <div class="brand">Autopilot</div>
    <h1>This status monitor has been retired.</h1>
