<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f3f4"><title>Autopilot service status</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Geist;src:url("fonts/geist-latin.woff2") format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
:root{color-scheme:light;font-family:Geist,system-ui,-apple-system,sans-serif;background:#f3f3f4;color:#202124;--green:#61b99c;--muted:#777a80;--line:#eeeef0}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:32px auto;padding:32px 40px;background:#fff;border-radius:24px;box-shadow:0 0 0 1px rgb(17 24 39 / .025),0 2px 8px rgb(17 24 39 / .025)}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:650;letter-spacing:-.04em;color:#202124}.brand svg{width:26px;height:26px}.brand-label{display:flex;gap:12px;align-items:center}.brand-label span{color:var(--muted);font-size:14px;font-weight:450;letter-spacing:0;border-left:1px solid #dedee1;padding-left:12px}a{color:inherit;text-decoration:none}.open-app{background:#f5f5f6;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:500}.open-app:hover{background:#ebebed}h1{font-size:clamp(24px,4vw,32px);font-weight:600;letter-spacing:-.045em;line-height:1.2;margin:0 0 10px}p{color:var(--muted);line-height:1.6}#summary{border-radius:14px;background:#eef8f3;padding:24px;margin-bottom:30px;box-shadow:inset 0 0 0 1px #dfeee7}#summary.unknown{background:#f6f6f7;box-shadow:inset 0 0 0 1px #eeeef0}#summary.down{background:#fff5f2;box-shadow:inset 0 0 0 1px #f4e2db}#updated{font-size:13px;margin:0}.controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}.controls h2{font-size:14px;font-weight:600;margin:0}nav{display:flex;gap:2px;padding:3px;background:#f5f5f6;border-radius:9px}button{font:inherit;font-size:12px;color:#6d7076;background:transparent;border:0;padding:7px 11px;border-radius:7px;cursor:pointer}button[aria-pressed=true]{color:#202124;background:#fff;box-shadow:0 1px 3px rgb(17 24 39 / .08)}button:hover{color:#202124}button:focus-visible,a:focus-visible{outline:2px solid #399477;outline-offset:4px}#services{border:1px solid var(--line);border-radius:14px;overflow:hidden}.service{padding:22px 24px;background:#fff}.service+.service{border-top:1px solid var(--line)}.service-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.service h3{margin:0;font-size:14px;font-weight:550}.badge{font-size:12px;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;background:#f5f5f6;color:#73767c}.badge.up{color:#2e8065;background:#edf8f2}.badge.down{color:#b45338;background:#fff1eb}.dot{height:6px;width:6px;border-radius:50%;background:#a5a6ab}.up .dot{background:var(--green)}.down .dot{background:#d68871}.bars{display:flex;align-items:center;gap:2px;height:20px}.bar{flex:1;min-width:0;height:14px;border-radius:2px;background:#eff0f2}.bar.up{background:var(--green)}.bar.down{background:#da8d76}.bar.partial{background:#d6b971}.bar.gap{opacity:.5}.bars.empty{position:relative}.bars.empty:before{content:"";height:2px;width:100%;background:#eeeef0;border-radius:2px}.bars.empty .bar{display:none}.axis{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#8b8e94;margin:6px 0 0}.axis span:nth-child(2){color:#73767c}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:#8b8e94;margin:16px 0 0}.legend span:before{content:'';display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--green);margin-right:6px}.legend .fail:before{background:#da8d76}.legend .partial:before{background:#d6b971}.legend .missing:before{background:#e1e1e6}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:26px;color:#96989e;font-size:11px}@media(max-width:700px){main{margin:12px;padding:24px 20px;border-radius:18px}header{gap:12px;margin-bottom:24px}.brand{font-size:16px}.brand-label{gap:9px}.brand-label span{padding-left:9px;font-size:12px}.brand svg{width:23px;height:23px}.open-app{padding:8px 9px;font-size:12px}#summary{padding:20px;margin-bottom:24px}.service{padding:20px 16px}.bars{gap:2px}.axis{font-size:10px}.controls{gap:10px}.controls h2{font-size:13px}button{padding:7px 9px}}
</style>
</head>
<body><main>
<header><a class="brand" href="https://app.aplt.ai" aria-label="Autopilot home"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 943 943" fill="currentColor" aria-hidden="true"><path d="M350.467,157.806 C373.18,120.678 415.153,97.807 460.578,97.807 C506.003,97.807 547.977,120.678 570.689,157.806 L880.241,663.811 C902.954,700.939 902.955,746.684 880.242,783.812 C857.53,820.94 815.555,843.812 770.129,843.812 C666.844,843.812 409.268,844.46 206.475,845.017 C149.658,845.148 97.088,816.644 68.59,770.255 C40.091,723.865 40.0,666.647 68.347,620.175 C169.791,453.795 298.775,242.302 350.467,157.806 ZM444.664,713.813 L696.72,713.813 C708.077,713.813 718.57,708.095 724.249,698.813 C729.926,689.531 729.926,678.094 724.249,668.813 L488.106,282.805 C482.429,273.523 471.934,267.805 460.578,267.805 C449.222,267.805 438.728,273.523 433.05,282.805 L307.025,488.811 C278.633,535.222 278.633,592.401 307.023,638.812 C335.414,685.222 387.883,713.813 444.664,713.813 Z"/></svg><span class="brand-label">Autopilot<span>Status</span></span></a><a class="open-app" href="https://app.aplt.ai">Open Autopilot ↗</a></header>
<section id="summary" class="unknown" aria-live="polite"><h1 id="headline">Service status</h1><p id="updated">Loading the latest updates…</p></section>
<div class="controls"><h2>Service availability</h2><nav aria-label="History range"><button data-hours="24" aria-pressed="true">24 hours</button><button data-hours="168" aria-pressed="false">7 days</button><button data-hours="720" aria-pressed="false">30 days</button></nav></div>
<div id="services"></div>
<div class="legend"><span>Available</span><span class="partial">Intermittent availability</span><span class="fail">Unavailable</span><span class="missing">No data</span></div>
<footer><span>Autopilot service status</span><span id="historyUpdated">No history available yet.</span></footer>
</main>
<script>
const API='https://uptime-api.aplt.ai/status';
const DEFINITIONS=[{id:'app',name:'Autopilot'},{id:'sign',name:'Autopilot Sign'},{id:'docs',name:'Documentation'}];
let snapshot=null,hours=24,fetchFailed=false,restartsAt=null;
const el=(tag,className,text)=>{const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node};
const ago=ms=>{const n=Math.max(0,Math.floor(ms/60000));return n<1?'just now':`${n} minute${n===1?'':'s'} ago`};
function bucketClass(up,total,expected){return total===0?'':`${up===total?'up':up===0?'down':'partial'}${total<expected?' gap':''}`}
function draw(){
 const now=Date.now(),stale=!snapshot||now-Date.parse(snapshot.checkedAt)>180000;
 const fresh=DEFINITIONS.every(t=>{const row=snapshot?.targets.find(r=>r.target_id===t.id);return row&&now-row.minute*60000<=180000});
 const allUp=!fetchFailed&&!stale&&fresh&&snapshot.targets.every(r=>r.ok===1);
 const unavailable=fetchFailed||stale||!fresh;
 document.getElementById('summary').className=unavailable?'unknown':allUp?'':'down';
 document.getElementById('headline').textContent=unavailable?'Status unavailable':allUp?'All listed services are available':'Some services are unavailable';
 document.getElementById('updated').textContent=snapshot?`Last updated ${ago(now-Date.parse(snapshot.checkedAt))}${unavailable?' · current status unavailable':''}`:restartsAt?`Status updates resume ${new Date(restartsAt).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}.`:'The latest status is temporarily unavailable. Please check back soon.';
 const container=document.getElementById('services');container.replaceChildren();
 const endHour=Math.floor((snapshot?Date.parse(snapshot.checkedAt):now)/3600000)*60;
 const groupHours=hours===720?8:hours===168?2:1;
 for(const t of DEFINITIONS){
  const row=snapshot?.targets.find(r=>r.target_id===t.id);
  const unknown=fetchFailed||!row||now-row.minute*60000>180000;
  const card=el('section','service'),heading=el('div','service-head');
  heading.append(el('h3','',t.name));const badge=el('span',`badge ${unknown?'':row.ok?'up':'down'}`);badge.append(el('span','dot'),el('span','',unknown?'No data':row.ok?'Available':'Unavailable'));heading.append(badge);card.append(heading);
  const bars=el('div','bars');let totalChecks=0,passing=0;
  for(let i=0;i<hours/groupHours;i++){
   const start=endHour-(hours-1)*60+i*groupHours*60;
   const rows=(snapshot?.hourly??[]).filter(r=>r.target_id===t.id&&r.bucket>=start&&r.bucket<start+groupHours*60);
   const total=rows.reduce((n,r)=>n+r.total,0),up=rows.reduce((n,r)=>n+r.up,0);totalChecks+=total;passing+=up;
   const bar=el('div',`bar ${bucketClass(up,total,groupHours*60)}`);bar.title=`${new Date(start*60000).toLocaleString()}: ${total?`${(up/total*100).toFixed(2)}% observed availability${total<groupHours*60?' · partial history':''}`:'No data'}`;bars.append(bar);
  }
  if(!totalChecks)bars.classList.add('empty');
  bars.setAttribute('role','img');bars.setAttribute('aria-label',`${hours}-hour availability history. ${totalChecks?`${(passing/totalChecks*100).toFixed(2)} percent observed availability.`:'No data available.'} Missing periods have no status.`);card.append(bars);
  const axis=el('div','axis');axis.append(el('span','',hours===24?'24 hours ago':hours===168?'7 days ago':'30 days ago'),el('span','',totalChecks?`${(passing/totalChecks*100).toFixed(2)}% observed availability`:'History will appear here'),el('span','','Now'));card.append(axis);
  container.append(card);
 }
 document.getElementById('historyUpdated').textContent=snapshot?`History updated ${ago(now-Date.parse(snapshot.historyUpdatedAt))}`:'No history available yet.';
}
async function load(){if(document.hidden)return;try{const response=await fetch(API,{signal:AbortSignal.timeout(12000)});if(!response.ok){const error=await response.json().catch(()=>({}));restartsAt=error.startsAt??null;throw Error('Unavailable')}const data=await response.json();if(!Array.isArray(data.targets)||!Array.isArray(data.hourly)||!Array.isArray(data.daily)||!Number.isFinite(Date.parse(data.checkedAt)))throw Error('Invalid snapshot');snapshot=data;fetchFailed=false;restartsAt=null}catch{fetchFailed=true}draw()}
document.querySelectorAll('[data-hours]').forEach(button=>button.addEventListener('click',()=>{hours=Number(button.dataset.hours);document.querySelectorAll('[data-hours]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));draw()}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});draw();load();setInterval(load,60000);setInterval(draw,15000);
</script></body></html>
