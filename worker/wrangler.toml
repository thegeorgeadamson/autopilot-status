# The retired monitor exhausted the account allowance on 12 October.
# This one-time gate makes no D1 calls before the next midnight UTC reset.
[vars]
MONITOR_START_AT = "2026-10-13T00:00:00Z"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "autopilot-uptime"
database_id = "65b5ad4b-5b4d-4347-abdf-195863de72e5"
