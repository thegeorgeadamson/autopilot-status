name = "autopilot-uptime"
main = "src/index.ts"
compatibility_date = "2026-01-15"
account_id = "d0525d53f111e4f76936be14c633621e"
workers_dev = false
preview_urls = false
routes = [
  { pattern = "uptime-api.aplt.ai", custom_domain = true }
